name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organize files
        run: |
          mkdir -p gradle/wrapper
          mkdir -p src/main/java/com/artem/visuals/{config,crosshair,effects,gui,hud,optimize}
          mkdir -p src/main/resources/assets/artemvisuals/lang
          mv gradle-wrapper.properties gradle/wrapper/
          mv ArtemVisualsClient.java src/main/java/com/artem/visuals/
          mv ArtemConfig.java ProfileManager.java src/main/java/com/artem/visuals/config/
          mv CrosshairRenderer.java src/main/java/com/artem/visuals/crosshair/
          mv EffectManager.java src/main/java/com/artem/visuals/effects/
          mv ArtemScreen.java NeonButton.java src/main/java/com/artem/visuals/gui/
          mv HudElement.java HudManager.java src/main/java/com/artem/visuals/hud/
          mv Optimizer.java src/main/java/com/artem/visuals/optimize/
          mv fabric.mod.json src/main/resources/
          mv icon.png src/main/resources/assets/artemvisuals/
          mv en_us.json ru_ru.json src/main/resources/assets/artemvisuals/lang/
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: artem-visuals-mod
          path: build/libs/*.jar
